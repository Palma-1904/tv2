<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mein TV</title>
<style>
:root {
  --bg:      #000000;
  --panel:   #1c1c1e;
  --panel-hv:#2c2c2e;
  --text:    #ffffff;
  --soft:    #a1a1aa;
  --tv:      #0A84FF;
  --mov:     #BF5AF2;
  --ser:     #32D74B;
  --radius:  16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { 
  height: 100vh; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
  -webkit-font-smoothing: antialiased; 
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── ANIMATIONEN ── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
@keyframes pulse { 0% { background-color: #2a2a2a; } 50% { background-color: #3a3a3a; } 100% { background-color: #2a2a2a; } }
.skeleton { animation: pulse 1.5s infinite ease-in-out; border-radius: 12px; height: 60px; margin-bottom: 12px; }

/* ── HEADER & NAVIGATION (Glassmorphism) ── */
.header {
  padding: max(20px, env(safe-area-inset-top, 20px)) 20px 15px;
  background: rgba(10, 10, 10, 0.75);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  position: sticky; top: 0; z-index: 50;
}
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; height: 44px; }
.back-btn {
  display: flex; align-items: center; gap: 4px;
  background: transparent; border: none; color: var(--tv);
  font-size: 17px; font-weight: 600; cursor: pointer; padding: 0 8px 0 0;
}
.back-btn:active { opacity: 0.6; }
.page-title { font-size: 17px; font-weight: 700; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-spacer { width: 70px; } /* Platzhalter für Symmetrie */

.search-wrap { position: relative; margin-bottom: 16px; }
#search {
  width: 100%; height: 40px; padding: 0 16px 0 40px;
  background: rgba(255,255,255,0.1); border: none;
  border-radius: 12px; color: var(--text); font-size: 16px; outline: none;
}
#search:focus { background: rgba(255,255,255,0.15); }
.search-icon { position: absolute; left: 14px; top: 10px; font-size: 16px; opacity: 0.5; }

/* ── TABS ── */
.tabs { display: flex; gap: 8px; }
.tab {
  flex: 1; padding: 10px 4px; border-radius: 10px;
  background: rgba(255,255,255,0.05); color: var(--soft);
  font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s;
}
.tab span:last-child { font-size: 11px; font-weight: 500; opacity: 0.7; }
.tab.active-tv  { background: rgba(10,132,255,0.2); color: var(--tv); }
.tab.active-mov { background: rgba(191,90,242,0.2); color: var(--mov); }
.tab.active-ser { background: rgba(50,215,75,0.2);  color: var(--ser); }

/* ── CONTENT AREA ── */
#content {
  flex: 1; overflow-y: auto; padding: 20px 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
  -webkit-overflow-scrolling: touch;
}
.view-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; color: var(--text); }

/* ── GRID SYSTEM ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
@media(min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; } }
/* Spezielles Hochformat-Grid für Filme & Serien */
.grid.portrait { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
@media(min-width: 600px) { .grid.portrait { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

.cat-card {
  background: var(--panel); border-radius: var(--radius); padding: 20px 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; min-height: 110px; transition: transform 0.1s;
}
.cat-card:active { transform: scale(0.96); background: var(--panel-hv); }
.cat-card.special { background: linear-gradient(135deg, #2a2a2e, #1c1c1e); border: 1px solid rgba(255,255,255,0.1); }
.cat-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; }
.cat-count { font-size: 13px; color: var(--soft); font-weight: 500; }

.ch-card {
  background: var(--panel); border-radius: var(--radius); position: relative;
  display: flex; flex-direction: column; overflow: hidden; cursor: pointer; transition: transform 0.1s;
}
.ch-card:active { transform: scale(0.96); }
.ch-logo {
  height: 90px; display: flex; align-items: center; justify-content: center;
  background: #151515; padding: 10px; font-size: 18px; font-weight: 800; color: #fff;
  text-align: center; line-height: 1.2; word-break: break-word; text-transform: uppercase;
}
.ch-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.ch-name {
  padding: 10px; font-size: 13px; font-weight: 600; color: var(--text);
  text-align: center; line-height: 1.3; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px;
}

/* Portrait-Modus für Filme/Serien */
.ch-card.portrait .ch-logo { height: 160px; padding: 0; background: #222; }
.ch-card.portrait .ch-logo img { object-fit: cover; width: 100%; height: 100%; }
.ch-card.portrait .ch-name { display: none; } /* Name ausblenden, Cover füllt Kachel */

/* Favoriten-Button auf der Kachel */
.fav-btn {
  position: absolute; top: 6px; right: 6px; width: 28px; height: 28px;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 14px; border: none; color: #fff; cursor: pointer; z-index: 5;
}
.fav-btn.active { color: #FF3B30; } /* Rotes Herz */

/* ── EPISODEN ANSICHT ── */
.season-title { 
  font-size: 20px; font-weight: 700; margin: 28px 0 14px; 
  color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; 
}
.ep-card {
  background: var(--panel); border-radius: 12px; padding: 14px;
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
  text-decoration: none; color: var(--text); transition: transform 0.1s; cursor: pointer;
}
.ep-card:active { transform: scale(0.97); background: var(--panel-hv); }
.ep-num {
  font-size: 18px; font-weight: 800; color: var(--ser); width: 44px; text-align: center;
  background: rgba(50,215,75,0.1); padding: 8px 0; border-radius: 8px;
}
.ep-info { flex: 1; overflow: hidden; }
.ep-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep-play { font-size: 13px; color: var(--soft); font-weight: 500; }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.prog-bar { width: 200px; height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; width: 0%; background: var(--tv); transition: width 0.3s; }
.empty { text-align: center; padding: 60px 20px; color: var(--soft); font-size: 16px; }
</style>
</head>
<body>

<div id="loading">
  <div style="font-size: 40px">📺</div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
  <div style="color: var(--soft); font-weight: 600;" id="prog-text">Lade Sender...</div>
</div>

<div class="header" id="app-header" style="display:none;">
  <div class="top-bar">
    <button class="back-btn" id="btn-back" onclick="goBack()" style="visibility:hidden;">&#10094; Zurück</button>
    <div class="page-title" id="page-title">Mein TV</div>
    <div class="top-spacer" id="top-spacer"></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Suchen..." oninput="onSearch(this.value)">
  </div>
  <div class="tabs">
    <div class="tab active-tv" onclick="switchTab('tv')" id="tab-tv">
      <span>📺 TV</span><span id="cnt-tv">-</span>
    </div>
    <div class="tab" onclick="switchTab('mov')" id="tab-mov">
      <span>🎬 Filme</span><span id="cnt-mov">-</span>
    </div>
    <div class="tab" onclick="switchTab('ser')" id="tab-ser">
      <span>📂 Serien</span><span id="cnt-ser">-</span>
    </div>
  </div>
</div>

<div id="content"></div>

<script>
const M3U_URL = "liste2.m3u";

var db = { tv: {}, mov: {}, ser: {} };
var currentTab = "tv";
var viewMode = "cats"; // "cats", "channels", "search", "episodes"
var lastViewMode = "cats"; 
var activeGroup = "";
var searchVal = "";
var xcCredentials = null;
var activeSeriesData = null;

// Lokale Speicher (Favoriten & Zuletzt gesehen) laden
var favs = JSON.parse(localStorage.getItem('tv_favs')) || {}; // Format: { "url": {name, logo, type, url} }
var recent = JSON.parse(localStorage.getItem('tv_recent')) || []; // Format: [{name, logo, type, url}]

function saveStorage() {
  localStorage.setItem('tv_favs', JSON.stringify(favs));
  localStorage.setItem('tv_recent', JSON.stringify(recent));
}

function detectType(url, group) {
  var u = url.toLowerCase(); var g = group.toLowerCase();
  if (g.includes("serie") || g.includes("staffel") || g.includes("season") || /s\d{2}e?\d/.test(g) || u.includes("/series/")) return "ser";
  if (g.includes("film") || g.includes("movie") || g.includes("vod") || g.includes("kino") || u.includes("/movie/")) return "mov";
  if (/\.(mkv|mp4|avi|mov|wmv|m4v|flv)(\?|$)/.test(u)) return "mov";
  return "tv";
}

function parseM3U(text) {
  var data = { tv: {}, mov: {}, ser: {} };
  var lines = text.split("\n");
  var meta = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line.startsWith("#EXTINF")) {
      meta = {
        name:  (line.match(/,(.+)$/) || ["","?"])[1].trim(),
        logo:  (line.match(/tvg-logo="([^"]*)"/) || ["",""])[1].trim(),
        group: (line.match(/group-title="([^"]*)"/) || ["","Andere"])[1].trim()
      };
    } else if (meta && line && !line.startsWith("#")) {
      var type = detectType(line, meta.group);
      if (!data[type][meta.group]) data[type][meta.group] = [];
      data[type][meta.group].push({ name: meta.name, logo: meta.logo, url: line, type: type });
      
      if (!xcCredentials && line.startsWith("http")) {
         let match = line.match(/^(https?:\/\/[^\/]+)\/(?:live|movie|series)\/([^\/]+)\/([^\/]+)\//i);
         if (match) xcCredentials = { server: match[1], user: match[2], pass: match[3] };
      }
      meta = null;
    }
  }
  return data;
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function escJS(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

function setHeader(title, showBack) {
  document.getElementById('page-title').textContent = title;
  document.getElementById('btn-back').style.visibility = showBack ? "visible" : "hidden";
}

function switchTab(t) {
  currentTab = t; viewMode = "cats"; activeGroup = ""; searchVal = ""; document.getElementById("search").value = "";
  ["tv","mov","ser"].forEach(x => document.getElementById("tab-"+x).className = "tab" + (x === t ? " active-"+x : ""));
  render();
}

function goBack() {
  if (viewMode === "episodes") { viewMode = lastViewMode; } 
  else { viewMode = "cats"; activeGroup = ""; searchVal = ""; document.getElementById("search").value = ""; }
  render();
}

function openGroup(groupName) {
  viewMode = "channels"; activeGroup = groupName; document.getElementById("search").value = ""; searchVal = "";
  render();
}

function onSearch(val) {
  searchVal = val.trim().toLowerCase(); viewMode = searchVal ? "search" : "cats";
  render();
}

function getShortName(name) {
  let s = name;
  s = s.replace(/^([A-Z]{2,3}[:\|-]\s*)/i, '').replace(/\b(FHD|HD|SD|UHD|4K|RAW|HEVC|50fps|VIP)\b/gi, '').replace(/[_|\[\]\(\)]/g, ' ');
  s = s.replace(/\bSky Sport Bundesliga\b/gi, 'Sky Buli').replace(/\bSky Bundesliga\b/gi, 'Sky Buli').replace(/\bBundesliga\b/gi, 'Buli');
  s = s.replace(/\bSportdigital\b/gi, 'SpDi').replace(/\bAmazon Prime\b/gi, 'Prime');
  return s.replace(/\s+/g, ' ').trim(); 
}

// ── AKTIONEN (Play & Favorit) ──
function toggleFav(e, url, name, logo, type) {
  e.stopPropagation(); // Verhindert, dass der Klick den Sender öffnet
  if (favs[url]) { delete favs[url]; } 
  else { favs[url] = { name: name, logo: logo, url: url, type: type }; }
  saveStorage(); render(); // UI updaten
}

function playItem(url, name, logo, type) {
  // Zuletzt gesehen updaten
  recent = recent.filter(r => r.url !== url); // Duplikat entfernen
  recent.unshift({ name: name, logo: logo, url: url, type: type }); // Oben einfügen
  if (recent.length > 20) recent.pop(); // Maximal 20 merken
  saveStorage();

  if (type === "ser") { openSeries(url, name, logo); } 
  else { window.location.href = "outplayer://" + url; }
}

async function openSeries(url, name, logo) {
  if (!xcCredentials) { alert("Zugangsdaten nicht gefunden."); return; }
  let m = url.match(/series\/[^\/]+\/[^\/]+\/(\d+)/i);
  if (!m) { alert("Ungültiger Serien-Link."); return; }
  let seriesId = m[1];
  
  lastViewMode = viewMode; viewMode = "episodes"; 
  setHeader(name, true);
  
  // Skeleton Loader anzeigen
  let skeletons = "";
  for(let i=0; i<5; i++) { skeletons += '<div class="skeleton"></div>'; }
  document.getElementById("content").innerHTML = `<div class="fade-in"><div class="season-title">Lade Staffeln...</div>${skeletons}</div>`;

  let apiUrl = `${xcCredentials.server}/player_api.php?username=${xcCredentials.user}&password=${xcCredentials.pass}&action=get_series_info&series_id=${seriesId}`;
  let proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(apiUrl);
  
  try {
    let res = await fetch(apiUrl).catch(() => fetch(proxyUrl));
    let json = await res.json();
    if (!json || !json.episodes) throw new Error();
    activeSeriesData = { name: name, logo: logo, data: json };
    render();
  } catch(e) {
    document.getElementById("content").innerHTML = '<div class="empty">Fehler beim Abrufen.</div>';
  }
}

// ── RENDER SYSTEM ──
function render() {
  var content = document.getElementById("content");
  var html = '<div class="fade-in">'; // Animations-Container
  var isPortrait = (currentTab === "mov" || currentTab === "ser"); // Hochformat Check
  var gridClass = isPortrait ? "grid portrait" : "grid";

  if (viewMode === "episodes") {
    html += renderEpisodesView();
    html += '</div>';
    content.innerHTML = html;
    return;
  }

  if (viewMode === "search") {
    setHeader("Suche", true);
    html += `<div class="${gridClass}">`;
    var found = 0;
    Object.keys(db[currentTab]).forEach(g => {
      db[currentTab][g].forEach(ch => {
        if (ch.name.toLowerCase().includes(searchVal) || g.toLowerCase().includes(searchVal)) {
          html += renderChannelCard(ch, isPortrait); found++;
        }
      });
    });
    html += '</div></div>';
    content.innerHTML = found ? html : '<div class="empty">Keine Ergebnisse.</div>';
    return;
  }

  if (viewMode === "cats") {
    let titleMap = { "tv": "Live TV", "mov": "Filme", "ser": "Serien" };
    setHeader(titleMap[currentTab], false);
    
    html += `<div class="grid">`;
    
    // 1. Synthetische Ordner für Favoriten & Zuletzt gesehen
    let myFavs = Object.values(favs).filter(c => c.type === currentTab);
    let myRecent = recent.filter(c => c.type === currentTab);
    
    if (myRecent.length > 0) {
      html += `<div class="cat-card special" onclick="openGroup('🕒 Zuletzt gesehen')">
                 <div class="cat-name">🕒 Zuletzt gesehen</div><div class="cat-count">${myRecent.length} Titel</div>
               </div>`;
    }
    if (myFavs.length > 0) {
      html += `<div class="cat-card special" onclick="openGroup('⭐ Favoriten')">
                 <div class="cat-name">⭐ Favoriten</div><div class="cat-count">${myFavs.length} Titel</div>
               </div>`;
    }

    // 2. Normale Ordner
    var keys = Object.keys(db[currentTab]).sort();
    keys.forEach(g => {
      html += `<div class="cat-card" onclick="openGroup('${esc(g)}')">
                 <div class="cat-name">${esc(g)}</div>
                 <div class="cat-count">${db[currentTab][g].length} Einträge</div>
               </div>`;
    });
    
    html += '</div></div>';
    content.innerHTML = keys.length > 0 || myFavs.length > 0 ? html : '<div class="empty">Keine Inhalte</div>';
  } 
  else if (viewMode === "channels") {
    setHeader(activeGroup, true);
    html += `<div class="${gridClass}">`;
    
    // Checken ob wir in einem "Spezial-Ordner" sind
    var chans = [];
    if (activeGroup === '⭐ Favoriten') chans = Object.values(favs).filter(c => c.type === currentTab);
    else if (activeGroup === '🕒 Zuletzt gesehen') chans = recent.filter(c => c.type === currentTab);
    else chans = db[currentTab][activeGroup] || [];

    chans.forEach(ch => { html += renderChannelCard(ch, isPortrait); });
    html += '</div></div>';
    content.innerHTML = html;
  }
}

function renderChannelCard(ch, isPortrait) {
  var shortName = getShortName(ch.name); 
  // Lazy Loading eingebaut!
  var logoHtml = ch.logo ? `<img src="${esc(ch.logo)}" loading="lazy" onerror="this.parentNode.textContent='${esc(shortName)}'">` : esc(shortName);
  var isFav = favs[ch.url] ? "active" : "";
  var favIcon = favs[ch.url] ? "♥" : "♡";
  var cardClass = isPortrait ? "ch-card portrait" : "ch-card";

  return `<div class="${cardClass}" onclick="playItem('${escJS(ch.url)}', '${escJS(ch.name)}', '${escJS(ch.logo)}', '${ch.type}')">
            <button class="fav-btn ${isFav}" onclick="toggleFav(event, '${escJS(ch.url)}', '${escJS(ch.name)}', '${escJS(ch.logo)}', '${ch.type}')">${favIcon}</button>
            <div class="ch-logo">${logoHtml}</div>
            <div class="ch-name">${esc(shortName)}</div>
          </div>`;
}

function renderEpisodesView() {
  if (!activeSeriesData) return "";
  var data = activeSeriesData.data;
  let epsObj = data.episodes || {};
  if (Array.isArray(epsObj)) epsObj = { "1": epsObj }; 

  let seasons = Object.keys(epsObj).sort((a,b) => parseInt(a)-parseInt(b));
  if (seasons.length === 0) return '<div class="empty">Keine Episoden verfügbar.</div>';
  
  var html = "";
  seasons.forEach(s => {
     html += `<div class="season-title">Staffel ${s}</div>`;
     let eps = epsObj[s] || [];
     eps.forEach(ep => {
         let ext = ep.container_extension || "mkv";
         let playUrl = `${xcCredentials.server}/series/${xcCredentials.user}/${xcCredentials.pass}/${ep.id}.${ext}`;
         let title = ep.title || `Episode ${ep.episode_num}`;
         html += `
         <div class="ep-card" onclick="window.location.href='outplayer://${esc(playUrl)}'">
            <div class="ep-num">${ep.episode_num}</div>
            <div class="ep-info">
               <div class="ep-title">${esc(title)}</div>
               <div class="ep-play">▶ Im Outplayer abspielen</div>
            </div>
         </div>`;
     });
  });
  return html;
}

// ── INIT ──
async function loadData() {
  try {
    var res = await fetch(M3U_URL);
    if (!res.ok) throw new Error();
    var text = await res.text();
    db = parseM3U(text);
    
    ["tv","mov","ser"].forEach(t => {
      var sum = 0; Object.values(db[t]).forEach(arr => sum += arr.length);
      document.getElementById("cnt-"+t).textContent = sum;
    });

    document.getElementById("loading").style.display = "none";
    document.getElementById("app-header").style.display = "block";
    render();
  } catch(e) {
    document.getElementById("prog-text").textContent = "Fehler (liste2.m3u fehlt?)";
    document.getElementById("prog").style.background = "#FF3B30";
  }
}

loadData();
</script>
</body>
</html>
